<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jimmy`s Diner - Ordering App </title>

       <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
      <script type="module" crossorigin src="/assets/index-BlxkJXRl.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-CL6eC6hK.css">
    </head>

    <body>

        <header>
            <div class="image-container">
                <img src="/images/headerimg.png" alt="Burger Image" />
                <div class="img-text">
                    <h3>Jimmy's Diner</h3>
                    <p class="small-text">The best burgers and pizzas in town.</p>
                </div>

            </div>
             
        </header>
        
        <main>
            
            <section id="menu-list"></section>
            <section>
                    <div class="checkout-section" id="order-box">
                        <h2 class="checkout-title">Your Order</h2>
                    <div id="order-details">
                        <div class="total-price">
                            <p>Total price:</p>
                            <p class="price">$0</p>
                        </div>
                    </div>
                    <button class="purchase-button" id="checkout-box">Complete Order</button>
                    </div>
            </section>

            <section>
                <div class="payment-container hidden" id="cc-box">
            <form class="payment-form">
                <h2 class="payment-title">Enter card details</h2>
                    <div class="input-group">
                        <input type="text" placeholder="Enter your name" required />
                        <input type="number" placeholder="Enter card number" required />
                        <input type="number" placeholder="Enter CVV" required />
                    </div>
                <button class="pay-button" type="submit" id="pay-btn">Pay</button>
            </form>
        </div>
            </section>


        <section>
            <div class="order-complete-container hidden" id="order-complete-box">
                <h2 class="order-complete-title">Thanks, James! Your order is on its way!</h2>
            </div>
        </section>

        </main>

    </body>
</html>
